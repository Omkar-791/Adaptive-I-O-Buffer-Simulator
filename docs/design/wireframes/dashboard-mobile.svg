<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1500" viewBox="0 0 390 1500" role="img" aria-label="Dashboard low fidelity wireframe"><rect width="100%" height="100%" fill="#fafafa"/><style>text{font-family:Arial,sans-serif;fill:#333;font-size:14px}.title{font-size:20px;font-weight:bold}.small{font-size:12px}</style><rect x="0" y="0" width="390" height="60" fill="#eee" stroke="#888"/><text x="12" y="24" font-weight="bold">Menu / Adaptive I/O Lab</text><text class="small" x="12" y="48"></text><text class="title" x="16" y="104">Dashboard</text><rect x="16" y="136" width="358" height="84" fill="#eee" stroke="#888"/><text x="28" y="160" font-weight="bold">Active run / selected run</text><text class="small" x="28" y="184">Run ID | strategy | state | native elapsed</text><text class="small" x="28" y="204">View Details | Cancel (active only) | New Simulation</text><rect x="16" y="236" width="358" height="72" fill="#eee" stroke="#888"/><text x="28" y="260" font-weight="bold">Throughput</text><text class="small" x="28" y="284">req/s | native window</text><rect x="16" y="324" width="358" height="72" fill="#eee" stroke="#888"/><text x="28" y="348" font-weight="bold">Buffer Occupancy</text><text class="small" x="28" y="372">slots | last measurement</text><rect x="16" y="412" width="358" height="72" fill="#eee" stroke="#888"/><text x="28" y="436" font-weight="bold">Backpressure</text><text class="small" x="28" y="460">producer wait ms</text><rect x="16" y="500" width="358" height="72" fill="#eee" stroke="#888"/><text x="28" y="524" font-weight="bold">Buffer Capacity</text><text class="small" x="28" y="548">slots | resize count</text><rect x="16" y="588" width="358" height="192" fill="#eee" stroke="#888"/><text x="28" y="612" font-weight="bold">Throughput over time</text><text class="small" x="28" y="636">Native elapsed (s) / req per second</text><text class="small" x="28" y="656">Measured samples only</text><rect x="16" y="796" width="358" height="192" fill="#eee" stroke="#888"/><text x="28" y="820" font-weight="bold">Buffer occupancy</text><text class="small" x="28" y="844">Native elapsed (s) / slots</text><text class="small" x="28" y="864">Occupancy line + actual capacity steps</text><rect x="16" y="1004" width="358" height="164" fill="#eee" stroke="#888"/><text x="28" y="1028" font-weight="bold">Producer backpressure</text><text class="small" x="28" y="1052">Native elapsed (s) / producer wait ms</text><rect x="16" y="1184" width="358" height="164" fill="#eee" stroke="#888"/><text x="28" y="1208" font-weight="bold">Adaptive allocation events</text><text class="small" x="28" y="1232">Time | stream | previous -&gt; actual</text><text class="small" x="28" y="1252">Requested capacity | reason | outcome</text><rect x="16" y="1364" width="358" height="100" fill="#eee" stroke="#888"/><text x="28" y="1388" font-weight="bold">Stream / queue overview</text><text class="small" x="28" y="1412">Stream ID | occupancy | capacity | throughput | run state</text><text class="small" x="28" y="1432">Scrollable table on mobile; no viewport overflow</text></svg>