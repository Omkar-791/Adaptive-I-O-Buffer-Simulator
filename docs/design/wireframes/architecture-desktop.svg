<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-label="Architecture low fidelity wireframe"><rect width="100%" height="100%" fill="#fafafa"/><style>text{font-family:Arial,sans-serif;fill:#333;font-size:14px}.title{font-size:20px;font-weight:bold}.small{font-size:12px}</style><rect x="0" y="0" width="224" height="1060" fill="#eee" stroke="#888"/><text x="12" y="24" font-weight="bold">Adaptive I/O Lab</text><text class="small" x="12" y="48">Simulation workspace</text><text class="small" x="12" y="68"></text><text class="small" x="12" y="88">Dashboard</text><text class="small" x="12" y="108">New Simulation</text><text class="small" x="12" y="128">History</text><text class="small" x="12" y="148">Architecture</text><rect x="224" y="0" width="1216" height="60" fill="#eee" stroke="#888"/><text x="236" y="24" font-weight="bold">Workspace / Architecture</text><text class="small" x="236" y="48"></text><text x="1220" y="35">Backend connection</text><text class="title" x="248" y="104">Architecture</text><rect x="248" y="136" width="1168" height="156" fill="#eee" stroke="#888"/><text x="260" y="160" font-weight="bold">Execution and observation flow</text><text class="small" x="260" y="184">React Frontend -- HTTP requests --&gt; Express API</text><text class="small" x="260" y="204">Express API -- validated configuration --&gt; Native process management</text><text class="small" x="260" y="224">Native process management -- spawn / terminate --&gt; C++ simulation engine</text><rect x="248" y="308" width="1168" height="156" fill="#eee" stroke="#888"/><text x="260" y="332" font-weight="bold">Native responsibilities</text><text class="small" x="260" y="356">Buffer resource manager -&gt; bounded streams: producer / buffer / consumer</text><text class="small" x="260" y="376">Metrics + adaptive controller -&gt; runtime resizing executor</text><text class="small" x="260" y="396">NDJSON telemetry / status / final result -&gt; backend -&gt; frontend</text><rect x="248" y="480" width="1168" height="132" fill="#eee" stroke="#888"/><text x="260" y="504" font-weight="bold">Responsibility boundaries</text><text class="small" x="260" y="528">Frontend observes; C++ implements algorithms</text><text class="small" x="260" y="548">Cancellation terminates process; result only on successful completion</text><text class="small" x="260" y="568">Native elapsed time differs from backend receipt timestamp</text></svg>