rors and backend errors preserve input</text><rect x="16" y="664" width="358" height="112" fill="#eee" stroke="#888"/><text x="28" y="688" font-weight="bold">Live configuration summary</text><text class="small" x="28" y="712">Strategy | requests | budget | workload | sampling</text><text class="small" x="28" y="732">Desktop: right column; mobile: below form</text><text class="small" x="28" y="752">[ Start Simulation ]</text></svg>